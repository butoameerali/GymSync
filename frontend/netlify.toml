[build]
  command = "npm run build"
  publish = "dist"

# Proxy backend API requests to Vercel backend
[[redirects]]
  from = "/api/*"
  to = "https://gymsycn.vercel.app/api/:splat"
  status = 200
  force = true

# Proxy static uploads if applicable
[[redirects]]
  from = "/uploads/*"
  to = "https://gymsycn.vercel.app/uploads/:splat"
  status = 200
  force = true

# Single Page Application (SPA) client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
